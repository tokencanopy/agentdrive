\* CI-scoped bound of ArtifactGC_fix.cfg (MaxClock 3 instead of 4) so the
\* exhaustive fix check fits a CI runner. Both bug counterexamples fit within
\* MaxClock 3, so this bound still covers the fixed races; run the full
\* config locally via `make tla-full`.
\* (blob.delete(if_generation_match=...) from the list_blobs metadata).
SPECIFICATION Spec
SYMMETRY Symm
CONSTANTS
  Writers = {w1, w2}
  Arts = {a1, a2}
  Hashes = {h1, h2}
  NoHash = NoHash
  MaxOps = 2
  MinAge = 1
  MaxClock = 3
  SweepPinsGeneration = TRUE
  ImmediateOrphanDelete = FALSE
INVARIANT NoDangling
