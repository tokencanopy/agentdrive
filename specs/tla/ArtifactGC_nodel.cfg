\* Immediate orphan delete removed; sweep still unpinned — isolates the
\* stale-listing race: sweep decides from listed metadata, deletes by name.
SPECIFICATION Spec
CONSTANTS
  Writers = {w1, w2}
  Arts = {a1, a2}
  Hashes = {h1, h2}
  NoHash = NoHash
  MaxOps = 2
  MinAge = 1
  MaxClock = 4
  SweepPinsGeneration = FALSE
  ImmediateOrphanDelete = FALSE
INVARIANT NoDangling
