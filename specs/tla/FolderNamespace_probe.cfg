\* The naive symmetric-probe fix WITHOUT a shared lock: still violated by the
\* race — both unlocked probes pass before either insert commits. The mirror
\* check alone is not a fix; it needs the shared serialization point.
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2}
  Names = {n1}
  MaxOps = 2
  UpsertChecksFolders = TRUE
  MkdirLocksDrive = FALSE
INVARIANT NoShadow
