name: release

# Two independent release trains (open-source design §4.8, §4.10):
#
#   v*                  the container image to ghcr.io/tokencanopy/agentdrive
#                       with provenance and SBOM attestations, then the
#                       self-host quickstart against the published image;
#   design-system-v*    the component library to npm as
#                       @tokencanopy/agentdrive-design-system.
#
# Separate tags because the two version independently: an image-only patch
# must not fail by trying to republish an npm version that already exists.

on:
  push:
    tags: ["v*", "design-system-v*"]

permissions:
  contents: read

jobs:
  image:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tokencanopy/agentdrive
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/tokencanopy/agentdrive
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  design-system:
    if: startsWith(github.ref_name, 'design-system-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: design-system/.nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: design-system
      - run: npm run build
        working-directory: design-system
      - name: The tag and the package version agree
        working-directory: design-system
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "design-system-v${version}" = "${GITHUB_REF_NAME}" ] \
            || { echo "::error::package.json says ${version}, the tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: Publish
        working-directory: design-system
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  smoke:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # A new GHCR package is private until someone makes it public.
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the published image in place of a local build
        env:
          IMAGE: ghcr.io/tokencanopy/agentdrive@${{ needs.image.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          docker tag "$IMAGE" agentdrive:selfhost
      - name: The README quickstart against the published image
        env:
          AGENTDRIVE_SMOKE_NO_BUILD: "1"
        run: scripts/selfhost-smoke.sh --down
